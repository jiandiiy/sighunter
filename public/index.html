<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- 🔁 CRA의 %PUBLIC_URL% 대신 Vite에서는 public/ 아래 파일을 절대 경로로 바로 참조 -->
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using Vite + React"
    />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    <title>React App</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- 🔴 Vite 엔트리 스크립트: 프로젝트 실제 엔트리 파일명에 맞게 수정 -->
    <script type="module" src="/src/main.jsx"></script>
    <!-- 예시:
         - 진입 파일이 src/index.js면:  src="/src/index.js"
         - 진입 파일이 src/main.tsx면: src="/src/main.tsx"
    -->
  </body>
</html>
